[package]
name = "stelix-vault"
version = "0.1.0"
description = "Stelix 2.0 Bull Lock vault program (Anchor skeleton — see lib.rs)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "stelix_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
