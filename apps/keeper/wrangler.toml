# Stelix 2.0 Keeper — Cloudflare Worker on cron (spec Part G).
# Deploy (NOT done in this local build): `npx wrangler deploy`
name = "stelix-keeper"
main = "src/index.ts"
compatibility_date = "2026-11-26"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "stelix-admin-db"
database_id = "598cd9fd-a29b-4286-b99d-f51c534d0308"

[vars]
TWAP_WINDOW_MINUTES = "30"
MAX_PRICE_IMPACT_BPS = "500"
DEFAULT_SLIPPAGE_BPS = "150"
MAX_RETRIES = "3"
# Chain RPC + vault addresses (public config, not secrets). Fill in after the
# Arc testnet deploy; the keeper skips a chain whose vault is unset.
RPC_URL_ARC = "https://rpc.testnet.arc.io"
VAULT_ADDRESS_ARC = "0x964bC93B65E1df3F6Bf0c44DeBCFFDEA76127Fe9"
# Secrets (set via `wrangler secret put <NAME>` — never commit values):
# KEEPER_PRIVATE_KEY (keeper wallet; can ONLY call executeTrigger/pokePrice per contract),
# NOTIFY_WEBHOOK_URL
